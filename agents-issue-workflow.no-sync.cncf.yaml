document:
  dsl: '1.0.3'
  namespace: edu.practice
  name: agents-issue-workflow-no-sync
  version: '1.0.0'
  title: 'Agent Issues + Git + Beads Workflow (No Sync)'
  summary: >
    Strict order for issues, work, stage, commit, and close
    (commit header: [<id>] <type>(P#): <title>; body: description; file list appended).
    Issue IDs must be in square brackets. No bd sync or git push.
  metadata:
    x-agent:
      bound_instructions: AGENTS.md
      intent: Use this workflow for all issue-driven work in this repo

do:
  - createIssue:
      run:
        shell:
          command: 'bd create <title> --type task --priority 2 --description <why>'
  - markInProgress:
      run:
        shell:
          command: 'bd update <id> --status in_progress'
  - doWork:
      do:
        - implement:
            run:
              shell:
                command: 'perform implementation'
        - test:
            run:
              shell:
                command: 'run tests'
        - fix:
            run:
              shell:
                command: 'apply fixes'
  - stageChanges:
      run:
        shell:
          command: 'git add -A'
  - commitChanges:
      run:
        shell:
          command: |
            ID=<issue_id>; TYPE=<issue_type>; PRIO=<issue_priority>; TITLE=<issue_title>;
            DESC=<issue_description>;
            HEADER="[$ID] $TYPE($PRIO): $TITLE";
            FILES=$(git diff --cached --name-status | awk '{code=$1; from=$2; to=$3; status="изменён"; if (code ~ /^A/) status="создан"; else if (code ~ /^D/) status="удалён"; else if (code ~ /^R/) { status="переименован"; printf "- %s %s -> %s (%s)\n", code, from, to, status; next } else if (code ~ /^C/) { status="скопирован"; printf "- %s %s -> %s (%s)\n", code, from, to, status; next } printf "- %s %s (%s)\n", code, from, status }');
            printf "%s\n\n%s\n\nИзменения:\n%s\n" "$HEADER" "$DESC" "$FILES" | git commit -F -
  - closeIssue:
      run:
        shell:
          command: 'bd close <id>'
