    <strong>{{ $lp.footer_name | default "Имя Фамилия" }}</strong> · © {{ now.Year }}

  <div>
    <a href="mailto:{{ $lp.footer_email | default "student@example.com" }}">{{ $lp.footer_email | default "student@example.com" }}</a>

  </div>
</div>
